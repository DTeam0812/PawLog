plugins {
    id 'java'
    id 'application'
}

dependencies {
    implementation project(':pawlog-common')

    // H2 Database
    implementation 'com.h2database:h2:2.3.232'

    // MySQL Connector/J (원격 MySQL 서버 접속용)
    implementation 'com.mysql:mysql-connector-j:9.0.0'
}

application {
    mainClass = 'com.pawlog.server.main.PawLogServer'
}
