plugins {
    id 'java'
    id 'application'
}

dependencies {
    implementation project(':pawlog-common')
    implementation 'com.github.lgooddatepicker:LGoodDatePicker:11.2.1'
    implementation 'org.xerial:sqlite-jdbc:3.53.2.1'
    // JNA (Windows API 사용)
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
}

application {
    mainClass = 'com.pawlog.client.main.App'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.register('packageJar', Jar) {
    dependsOn compileJava
    archiveFileName = 'pawlog-client-package.jar'
    destinationDirectory = layout.buildDirectory.dir('jpackage-libs')
    from sourceSets.main.output.classesDirs
    from 'src/main/resources'

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('prepareJpackageInput', Copy) {
    dependsOn packageJar
    into layout.buildDirectory.dir('jpackage-input')
    from tasks.named('packageJar')
    from configurations.runtimeClasspath
}
